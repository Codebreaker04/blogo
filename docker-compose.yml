version: '3.8'

services:
  # Database service (PostgreSQL)
  # Note: This is for local development only
  # In production, use Cloudflare D1 or another managed database
  database:
    image: postgres:15-alpine
    container_name: blogo-db
    environment:
      POSTGRES_DB: blogo
      POSTGRES_USER: blogo_user
      POSTGRES_PASSWORD: blogo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/migrations:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blogo_user -d blogo']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blogo-network

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blogo-frontend
    ports:
      - '80:80'
    networks:
      - blogo-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  blogo-network:
    driver: bridge
